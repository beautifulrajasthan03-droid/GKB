name: Build GKB APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Create Flutter Template Structure
        run: |
          flutter create . --org com.gkb.app --project-name gkb --platforms android

      - name: Restore pubspec.yaml and main.dart
        run: |
          # Flutter create will overwrite files, so we make sure our dependencies and main.dart are intact
          flutter pub get

      - name: Build APK
        run: flutter build apk --release

